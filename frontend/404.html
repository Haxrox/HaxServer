<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>404 - Not Found</title>
  <script type="module" src="https://unpkg.com/@fluentui/web-components"></script>
  <style>
    body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: var(--neutral-fill-rest); color: var(--neutral-foreground-rest); }
    fluent-button { --control-corner-radius: 6; }
  </style>
</head>
<body>
  <fluent-design-system-provider id="provider" use-defaults>
    <div style="text-align: center;">
      <h1 style="font-size: 3em; margin-bottom: 0;">404</h1>
      <p style="font-size: 1.2em; color: var(--neutral-foreground-hint);">Page Not Found</p>
      <a href="/" style="text-decoration: none; margin-top: 20px; display: inline-block;">
        <fluent-button appearance="primary">Go Home</fluent-button>
      </a>
    </div>
  </fluent-design-system-provider>
</body>
</html>
